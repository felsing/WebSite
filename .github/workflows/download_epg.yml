name: Download EPG File

on:
  schedule:
#    - cron: '0 */6 * * *'  # 每 6 小时执行一次
  workflow_dispatch:        # 支持手动触发

jobs:
  download-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download epg.xml.gz
        run: |
          curl -fsSL "https://iptv.yang-1989.xyz/epg.xml.gz" -o epg.xml.gz

      - name: Commit and push epg.xml.gz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          git commit -m "Update EPG file" || exit 0
          git push
