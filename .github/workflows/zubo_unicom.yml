name: Build Unicom IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download zubo_all.m3u
        run: |
          curl -fsSL \
          https://raw.githubusercontent.com/q1017673817/iptvz/refs/heads/main/zubo_all.m3u \
          -o zubo_all.m3u

      - name: Keep only Unicom channels
        run: |
          awk '
          /^#EXTINF/ { keep = ($0 ~ /联通/); }
          keep { print }
          ' zubo_all.m3u > zubo_unicom.body
     - name: Filter invalid IPTV servers
  run: |
    python3 <<'PY'
    import re
    import subprocess
    import random
    import os

    input_file = "zubo_unicom.body"
    output_file = "zubo_unicom.filtered"

    # ==================================================
    # 1. 读取 M3U
    # ==================================================

    groups = {}
    entries = []

    with open(input_file, "r", encoding="utf-8") as f:
        lines = [x.rstrip("\n") for x in f]

    i = 0

    while i < len(lines):

        if lines[i].startswith("#EXTINF"):

            extinf = lines[i]

            if i + 1 < len(lines) and lines[i + 1].startswith("http"):

                url = lines[i + 1]

                # 提取 http://IP:PORT
                m = re.match(r'^(https?://[^/]+)', url)

                if m:

                    server = m.group(1)

                    if server not in groups:
                        groups[server] = []

                    groups[server].append({
                        "extinf": extinf,
                        "url": url
                    })

                    entries.append({
                        "extinf": extinf,
                        "url": url,
                        "server": server
                    })

                i += 2
                continue

        i += 1


    # ==================================================
    # 2. 为每个 IP:PORT 选择测试频道
    #
    #    优先：
    #      CCTV-1
    #      CCTV-5
    #
    #    如果没有：
    #      随机选择
    #
    #    第一次失败：
    #      再随机选择一个不同频道测试
    # ==================================================

    valid_servers = set()

    random.seed()


    def choose_test_channels(channels):

        # 优先寻找 CCTV-1
        cctv1 = [
            x for x in channels
            if re.search(r'CCTV[-_ ]?1(\b|[^0-9])', x["extinf"], re.I)
        ]

        # 再寻找 CCTV-5
        cctv5 = [
            x for x in channels
            if re.search(r'CCTV[-_ ]?5(\b|[^0-9])', x["extinf"], re.I)
        ]

        preferred = cctv1 + cctv5

        # 如果有 CCTV-1 或 CCTV-5：
        # 第一个测试优先使用它们
        if preferred:

            first = random.choice(preferred)

        else:

            # 没有 CCTV-1 / CCTV-5
            # 随机选择第一个测试频道
            first = random.choice(channels)


        # 第二个测试频道：
        # 从剩余频道中随机选择一个
        remaining = [
            x for x in channels
            if x["url"] != first["url"]
        ]

        if remaining:
            second = random.choice(remaining)
        else:
            second = None

        return first, second


    # ==================================================
    # 3. 实际检测 IPTV 流
    # ==================================================

    def test_stream(url):

        tmp = "/tmp/iptv_test.ts"

        try:

            # 删除上一次测试文件
            try:
                os.remove(tmp)
            except FileNotFoundError:
                pass

            # 实际 GET IPTV 流
            #
            # IPTV 是持续数据流，因此：
            #
            # curl 5 秒后 timeout
            #
            # 并不代表失败。
            #
            # 只要已经收到足够的数据，
            # 就认为这个频道有效。

            subprocess.run(
                [
                    "curl",
                    "-4",
                    "-L",

                    "--connect-timeout", "3",
                    "--max-time", "5",

                    "-s",
                    "-o", tmp,

                    url
                ],
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
                timeout=8
            )

            try:
                size = os.path.getsize(tmp)
            except OSError:
                size = 0

            # 收到至少 100 KB 数据
            if size >= 100 * 1024:
                return True, size

            return False, size

        except Exception:
            return False, 0

        finally:

            try:
                os.remove(tmp)
            except FileNotFoundError:
                pass


    # ==================================================
    # 4. 开始检测
    # ==================================================

    print()
    print("=" * 70)
    print(f"发现 IPTV 服务器: {len(groups)}")
    print("=" * 70)
    print()


    for server, channels in groups.items():

        print(f"[SERVER] {server}")
        print(f"         共 {len(channels)} 个频道")

        first, second = choose_test_channels(channels)

        # ----------------------------------------------
        # 第一次测试
        # ----------------------------------------------

        print(f"         Test #1: {first['url']}")

        ok, size = test_stream(first["url"])

        if ok:

            print(f"         ✓ VALID ({size} bytes)")
            valid_servers.add(server)
            print()

            continue


        print(f"         ✗ FAILED ({size} bytes)")


        # ----------------------------------------------
        # 第二次测试
        # ----------------------------------------------

        if second:

            print(f"         Test #2: {second['url']}")

            ok, size = test_stream(second["url"])

            if ok:

                print(f"         ✓ VALID ({size} bytes)")
                valid_servers.add(server)

            else:

                print(f"         ✗ FAILED ({size} bytes)")
                print(f"         ✗ SERVER INVALID")

        else:

            print("         ✗ No second channel available")
            print("         ✗ SERVER INVALID")

        print()


    # ==================================================
    # 5. 输出检测结果
    # ==================================================

    print()
    print("=" * 70)
    print("检测结果")
    print("=" * 70)

    print(f"总服务器数 : {len(groups)}")
    print(f"有效服务器 : {len(valid_servers)}")
    print(f"无效服务器 : {len(groups) - len(valid_servers)}")

    print()
    print("有效服务器：")

    for server in sorted(valid_servers):
        print(f"  ✓ {server}")

    print()
    print("=" * 70)


    # ==================================================
    # 6. 根据服务器检测结果过滤 M3U
    #
    #    一个服务器只要测试成功一次，
    #    该服务器的所有频道全部保留。
    # ==================================================

    valid_count = 0
    removed_count = 0

    with open(output_file, "w", encoding="utf-8") as out:

        for item in entries:

            if item["server"] in valid_servers:

                out.write(item["extinf"] + "\n")
                out.write(item["url"] + "\n")

                valid_count += 1

            else:

                removed_count += 1


    # ==================================================
    # 7. 替换原文件
    # ==================================================

    os.replace(output_file, input_file)

    print()
    print(f"保留频道 : {valid_count}")
    print(f"删除频道 : {removed_count}")
    print()


    PY

      - name: Re-group channels
        run: |
          awk '
          /^#EXTINF/ {
              line = $0
              # 1. 基础分类逻辑
              if (line ~ /CCTV-5/) {
                  group = "体育频道"
              } else if (line ~ /CCTV-/) {
                  group = "央视频道"
              } else if (line ~ /卫视/) {
                  group = "卫视频道"
              } else if (line ~ /体育|篮球|足球/) {
                  group = "体育频道"
              } else if (line ~ /少儿|卡通|动画/) {
                  group = "少儿频道"
              } else {
                  # 2. 地方频道细分逻辑：提取频道名中的省份信息
                  # 匹配常见的省份或直辖市名称
                  if (line ~ /北京/) group = "北京频道"
                  else if (line ~ /天津/) group = "天津频道"
                  else if (line ~ /河北/) group = "河北频道"
                  else if (line ~ /山西/) group = "山西频道"
                  else if (line ~ /内蒙古/) group = "内蒙古频道"
                  else if (line ~ /辽宁/) group = "辽宁频道"
                  else if (line ~ /吉林/) group = "吉林频道"
                  else if (line ~ /黑龙江/) group = "黑龙江频道"
                  else if (line ~ /上海/) group = "上海频道"
                  else if (line ~ /江苏/) group = "江苏频道"
                  else if (line ~ /浙江/) group = "浙江频道"
                  else if (line ~ /安徽/) group = "安徽频道"
                  else if (line ~ /福建/) group = "福建频道"
                  else if (line ~ /江西/) group = "江西频道"
                  else if (line ~ /山东/) group = "山东频道"
                  else if (line ~ /河南/) group = "河南频道"
                  else if (line ~ /湖北/) group = "湖北频道"
                  else if (line ~ /湖南/) group = "湖南频道"
                  else if (line ~ /广东|广州|深圳/) group = "广东频道"
                  else if (line ~ /广西/) group = "广西频道"
                  else if (line ~ /海南/) group = "海南频道"
                  else if (line ~ /重庆/) group = "重庆频道"
                  else if (line ~ /四川/) group = "四川频道"
                  else if (line ~ /贵州/) group = "贵州频道"
                  else if (line ~ /云南/) group = "云南频道"
                  else if (line ~ /西藏/) group = "西藏频道"
                  else if (line ~ /陕西/) group = "陕西频道"
                  else if (line ~ /甘肃/) group = "甘肃频道"
                  else if (line ~ /青海/) group = "青海频道"
                  else if (line ~ /宁夏/) group = "宁夏频道"
                  else if (line ~ /新疆/) group = "新疆频道"
                  else group = "地方频道"
              }
              
              # 替换原有的 group-title
              sub(/group-title="[^"]*"/, "group-title=\"" group "\"", line)
              print line
              getline
              print
          } ' zubo_unicom.body > zubo_unicom.grouped

      - name: Add EXTM3U header and finalize
        run: |
          echo '#EXTM3U x-tvg-url="https://github.com/mytv-android/myEPG/raw/refs/heads/master/output/epg.gz"' > zubo_unicom.m3u
          cat zubo_unicom.grouped >> zubo_unicom.m3u
          rm -f zubo_unicom.body zubo_unicom.grouped

      - name: Commit and push result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add zubo_unicom.m3u
          git commit -m "Update Unicom IPTV playlist (grouped + EPG)" || exit 0
          git push
